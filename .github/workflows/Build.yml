name: Build Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Build Dylib
        run: |
          mkdir -p temp_build
          cp -R "intex dylib/"* temp_build/
          cd temp_build
          find . -name "control" -exec perl -pi -e 's/\r//g' {} \; || true
          make clean
          make
          mkdir -p packages
          cp .theos/obj/arm64/*.dylib packages/libsubsystem.dylib || true
        env:
          CFLAGS: "-Wl,-U,___isPlatformVersionAtLeast"
          TARGET: iphone:clang:16.5:13.0
          ARCHS: arm64

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zev-Dylib
          path: |
            temp_build/.theos/obj/arm64/*.dylib
            temp_build/packages/*.dylib
          if-no-files-found: warn
